name: "Build scraper"
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm"
    - name: Cache on Cachix
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: flake-programs-sqlite
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: Cache build result on GitHub
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: updater.bundle
        key: ${{ runner.os }}-bundle-${{ hashFiles('**/flake.lock') }}-${{ hashFiles('**/*.nix') }}-${{ hashFiles('**/*.nim*') }}

    - name: Build and Bundle
      run: |
           nix build .#updater
           nix bundle --bundler github:NixOS/bundlers?rev=dce9249b74500ef75110153e6da455ffec2532ba#toArx -o updater.bundle.lnk .#packages.x86_64-linux.updater && cp $(readlink updater.bundle.lnk) updater.bundle && chmod u+w updater.bundle

    - name: Smoke test
      run: |
           echo {} > ${{ runner.temp }}/sources.json
           echo {} > ${{ runner.temp }}/latest.json
           nix run .#updater -- --dir:${{ runner.temp }} --channel:https://releases.nixos.org/nixos/20.03/nixos-20.03.2400.ff1b66eaea4
           cat ${{ runner.temp }}/sources.json
           [ `nix eval --impure nixpkgs#lib.importJSON --apply "x : (x ${{ runner.temp }}/sources.json).ff1b66eaea4399d297abda7419a330239842d715.programs_sqlite_hash"` = '"6097c544f012fc21f8cff9a6305ebab335d148e6385d7288a612e10c3cc82df0"' ]

    - name: Tarball input quick test
      run: |
           RESNOTB=$(nix eval --json --override-input nixpkgs "github:NixOS/nixpkgs?rev=cad22e7d996aea55ecab064e84834289143e44a0" .#programs-sqlite.src)
           [ "$RESNOTB" = '"/nix/store/lsplmmnvgjf3yh9xpr7s0g30x8h7zppw-nixexprs.tar.xz"' ]
           RESTB=$(nix eval --json --override-input nixpkgs "https://releases.nixos.org/nixos/unstable/nixos-26.05pre919991.cad22e7d996a/nixexprs.tar.xz?lastModified=1767116409&rev=cad22e7d996aea55ecab064e84834289143e44a0" .#programs-sqlite.src)
           [ "$RESTB" = '"/nix/store/bjgc3nmjz40w51x8gl0xvccspdzlr7ns-source"' ]

    - name: Integration test
      run: |
           nix build --no-link --override-input nixpkgs "github:NixOS/nixpkgs?rev=cad22e7d996aea55ecab064e84834289143e44a0" .#checks.x86_64-linux.vmtest
           nix build --no-link --override-input nixpkgs "https://releases.nixos.org/nixos/unstable/nixos-26.05pre919991.cad22e7d996a/nixexprs.tar.xz?lastModified=1767116409&rev=cad22e7d996aea55ecab064e84834289143e44a0" .#checks.x86_64-linux.vmtest
